    <title>Hi Babyy! <3 </title>
    <style>
        :root {
            --bg-1: #fff3f7;
            --bg-2: #ffdfe9;
            --card: rgba(255, 255, 255, 0.9);
            --rose: #f96ca8;
            --rose-deep: #e73f87;
            --rose-soft: #ffe4ee;
            --text: #5c2d45;
            --muted: #7a4b60;
            --shadow: rgba(233, 94, 150, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background: radial-gradient(circle at top, #fffafc 0%, var(--bg-1) 32%, var(--bg-2) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '♡';
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.25;
            animation: float 9s ease-in-out infinite;
        }

        body::before {
            left: 9%;
            top: 18%;
        }

        body::after {
            right: 10%;
            bottom: 18%;
            animation-delay: 1.5s;
        }

        .floating-hearts {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-hearts span {
            position: absolute;
            bottom: -50px;
            font-size: 1.5rem;
            opacity: 0.28;
            animation: drift 12s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-18px) scale(1.05); }
        }

        @keyframes drift {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.35;
            }
            100% {
                transform: translateY(-110vh) scale(1.25) rotate(18deg);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,240,247,0.9));
            border: 1px solid rgba(233, 115, 168, 0.18);
            padding: 22px 18px 18px;
            border-radius: 30px;
            box-shadow: 0 18px 40px rgba(200, 90, 130, 0.18), inset 0 1px 0 rgba(255,255,255,0.8);
            display: inline-block;
            max-width: 430px;
            width: min(100%, 430px);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .card::before {
            content: '✦';
            position: absolute;
            top: -10px;
            right: 22px;
            font-size: 1.6rem;
            color: var(--rose);
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            box-shadow: 0 8px 18px rgba(233, 94, 150, 0.13);
        }

        .card-top {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .mini-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffeef5, #ffdce9);
            border: 1px solid rgba(233, 115, 168, 0.18);
            color: var(--rose-deep);
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(233, 94, 150, 0.08);
        }

        h2 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            color: var(--rose-deep);
            font-weight: 600;
            letter-spacing: -0.04em;
        }

        #message {
            margin: 0 0 18px;
            font-size: 1.02rem;
            line-height: 1.6;
            color: var(--text);
            font-weight: 500;
        }

        .gif {
            width: 110px;
            margin: 8px auto 12px;
            border-radius: 20px;
            box-shadow: 0 12px 22px rgba(234, 88, 147, 0.18);
            display: block;
        }

        .love-meter {
            margin: 18px 0 14px;
            text-align: left;
        }

        .love-meter-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.04em;
            text-transform: lowercase;
        }

        .meter-track {
            width: 100%;
            height: 12px;
            background: rgba(255, 212, 228, 0.9);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(233, 115, 168, 0.18);
        }

        .meter-fill {
            width: 25%;
            height: 100%;
            background: linear-gradient(90deg, #ffb8d5, #ff7bb2, #e43d82);
            border-radius: inherit;
            transition: width 0.35s ease;
        }

        .celebration-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: linear-gradient(180deg, #fff1f9, #ffd8ea);
            color: var(--text);
            border: 1px solid rgba(233, 115, 168, 0.22);
            border-radius: 999px;
            padding: 10px 18px;
            box-shadow: 0 12px 24px rgba(233, 94, 150, 0.12);
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 3;
        }

        .celebration-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 10%, #ffcae1 40%, #ff6aac 100%);
            animation: pop 1s ease-out forwards;
            box-shadow: 0 0 14px rgba(233, 94, 150, 0.4);
        }

        @keyframes pop {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.2);
                opacity: 0;
            }
        }

        button {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(233, 115, 168, 0.22);
            background: linear-gradient(180deg, #ff7bad, #ef4d87);
            color: white;
            border-radius: 18px;
            cursor: pointer;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 0.96rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: none;
            box-shadow: 0 12px 18px rgba(233, 94, 150, 0.15);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        button:hover {
            background: linear-gradient(180deg, #ff8bbd, #f45d93);
            transform: translateY(-1px);
            box-shadow: 0 12px 18px rgba(233, 94, 150, 0.18);
        }

        button:active {
            transform: translateY(0);
        }
        .nav-buttons{
            display:flex;
            gap:8px;
            margin-top:10px;
        }

        .small-btn{
            flex:1;
            padding:10px 10px;
            font-size:0.82rem;
            border-radius:14px;
            background: linear-gradient(180deg, #ffe9f4, #ffd3e4);
            border: 1px solid rgba(233,115,168,0.18);
            box-shadow: 0 6px 12px rgba(233,94,150,0.08);
            cursor:pointer;
            font-weight:600;
            color: var(--text);
        }

        .download-panel {
            position: relative;
            z-index: 1;
            margin-top: 26px;
            width: min(100%, 760px);
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,244,249,0.94));
            border: 1px solid rgba(233, 115, 168, 0.22);
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(233, 94, 150, 0.12);
            padding: 24px 18px 18px;
            display: none;
        }

        .download-panel.show {
            display: block;
        }

        .download-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .download-header span {
            display: inline-block;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .download-header h3 {
            margin: 0;
            color: var(--rose-deep);
            font-size: clamp(1.3rem, 2vw, 1.9rem);
        }

        .download-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .download-item {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 12px;
            background: linear-gradient(180deg, #fff0f7, #ffd7e8);
            color: var(--text);
            border: 1px solid rgba(233, 115, 168, 0.18);
            font-weight: 700;
            font-size: 0.86rem;
            box-shadow: 0 8px 16px rgba(233, 94, 150, 0.08);
        }

        .download-item:hover {
            background: linear-gradient(180deg, #fff4fa, #ffe0ef);
        }

        .device-hint {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.74rem;
            line-height: 1.5;
            text-align: center;
        }

        .covers-section {
            position: relative;
            z-index: 1;
            margin-top: 26px;
            width: min(100%, 760px);
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,244,249,0.94));
            border: 1px solid rgba(233, 115, 168, 0.22);
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(233, 94, 150, 0.12);
            padding: 24px 18px 18px;
            display: none;
        }

        .covers-section.show {
            display: block;
        }

        .covers-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .covers-header span {
            display: inline-block;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .covers-header h3 {
            margin: 0;
            color: var(--rose-deep);
            font-size: clamp(1.3rem, 2vw, 1.9rem);
        }

        .cover-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
        }

        .gallery-viewport {
            overflow: hidden;
            width: 100%;
        }

        .gallery-track {
            display: flex;
            transition: transform 0.25s ease;
            will-change: transform;
        }

        .gallery-page {
            min-width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .cover-card {
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(233, 115, 168, 0.18);
            border-radius: 20px;
            padding: 14px 12px 12px;
            text-align: left;
            box-shadow: 0 10px 24px rgba(233, 94, 150, 0.06);
        }

        .cover-art {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 72px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffd8ea, #f7a9c7, #ef5d91);
            color: white;
            font-size: 2rem;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .cover-card h4 {
            margin: 0 0 6px;
            color: var(--text);
            font-size: 1.02rem;
        }

        .cover-card p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .cover-card audio {
            width: 100%;
            margin-bottom: 10px;
            height: 32px;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 12px;
            background: linear-gradient(180deg, #ff7bad, #ef4d87);
            color: white;
            font-weight: 700;
            font-size: 0.86rem;
            box-shadow: 0 8px 16px rgba(233, 94, 150, 0.14);
        }

        .download-btn:hover {
            background: linear-gradient(180deg, #ff8bbd, #f45d93);
        }

        .photo-section {
            position: relative;
            z-index: 1;
            margin-top: 26px;
            width: min(100%, 760px);
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,244,249,0.94));
            border: 1px solid rgba(233, 115, 168, 0.22);
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(233, 94, 150, 0.12);
            padding: 24px 18px 18px;
            display: none;
        }

        .photo-section.show {
            display: block;
        }

        .photo-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .photo-header span {
            display: inline-block;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .photo-header h3 {
            margin: 0;
            color: var(--rose-deep);
            font-size: clamp(1.3rem, 2vw, 1.9rem);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .photo-card {
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(233, 115, 168, 0.18);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 10px 24px rgba(233, 94, 150, 0.06);
        }

        .photo-placeholder {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffdbe9, #ffbfd8, #f9a7c7);
            color: rgba(255,255,255,0.92);
            font-size: 2rem;
            border: 1px solid rgba(233, 115, 168, 0.22);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 14px;
            display: block;
            background: #ffeaf3;
            border: 1px solid rgba(233, 115, 168, 0.14);
        }

        .photo-card h4 {
            margin: 10px 0 6px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .photo-card p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .photo-card a {
            display: inline-block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 12px;
            background: linear-gradient(180deg, #ff7bad, #ef4d87);

        }

        .photo-card a:hover {

        }

        .music-panel {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 40;
            width: min(360px, calc(100vw - 20px));
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,239,245,0.94));
            border: 1px solid rgba(233, 115, 168, 0.2);
            border-radius: 18px;
            padding: 10px 12px 10px;
            box-shadow: 0 18px 30px rgba(186, 82, 122, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: width 0.2s ease, padding 0.2s ease, opacity 0.2s ease;
        }

        .music-panel .music-toggle {
            position: absolute;
            top: 9px;

            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid rgba(233, 115, 168, 0.22);
            background: linear-gradient(180deg, #fff0f6, #ffdfe9);
            color: var(--rose-deep);
            font-size: 0.82rem;
            line-height: 1;
            display: grid;
            place-items: center;
            box-shadow: 0 8px 16px rgba(233, 94, 150, 0.08);
            padding: 0;
            margin: 0;
            min-height: 26px;
        }

        .music-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-right: 42px;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
        }

        .music-panel .mini-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(180deg, #ff7bad, #ef4d87);
            box-shadow: 0 0 12px rgba(239, 77, 135, 0.45);
        }

        .music-panel audio {
            width: 100%;
            display: block;
            height: 38px;
        }

        .music-panel.collapsed {
            width: 54px;
            padding: 12px 10px;
        }

        .music-panel.collapsed label,
        .music-panel.collapsed audio {
            display: none;
        }

        .music-panel.collapsed .music-toggle {
            position: static;
            display: grid;
            margin: 0 auto;
        }

            .small-btn,

                min-height: 48px;
                font-weight: 600;
            }

            .small-btn {
                padding: 9px 8px;
                font-size: 0.75rem;
            }

            .download-panel,
            .covers-section,
            .photo-section {
                position: fixed;
                inset: 8vh 12px 18px;
                width: auto;
                max-width: none;
                padding: 14px 12px 12px;
                border-radius: 24px;
                background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,242,247,0.97));
                box-shadow: 0 18px 40px rgba(162, 63, 99, 0.2);
                z-index: 30;
                display: none;
                overflow: hidden;
            }

            .covers-section.show,
            .photo-section.show {
                display: flex;
                flex-direction: column;
            }

            .gallery-viewport {
                overflow: hidden;
                width: 100%;
                margin-top: 6px;
            }

            .gallery-track {
                display: flex;
                width: 100%;
                transition: transform 0.28s ease;
                touch-action: pan-y;
            }

            .gallery-page {
                min-width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                align-content: start;
            }

            .cover-card,
            .photo-card {
                min-width: 0;
                padding: 10px;
            }

            .cover-art,
            .photo-placeholder,
            .photo-card img {
                height: 150px;
            }

            .cover-card h4,
            .photo-card h4 {
                font-size: 0.92rem;
                font-weight: 600;
            }

            .gallery-close {
                align-self: flex-end;
                width: 36px;
                height: 36px;
                min-height: 36px;
                margin: 0 0 8px;
                border-radius: 50%;
                background: rgba(255, 227, 238, 0.9);
                color: var(--text);
                border: 1px solid rgba(233, 115, 168, 0.2);
                font-size: 1.2rem;
                line-height: 1;
                padding: 0;
            }
        }

        @media (min-width: 561px) {
            .gallery-close {
                display: none !important;
            }
        }

    </style>
</head>

        <div class="nav-buttons">
            <button id="prevBtn" class="small-btn" onclick="historyPrev()">← Rewind</button>
            <button id="nextBtn" class="small-btn" onclick="historyNext()">Forward →</button>
        </div>
        <button onclick="goToQuiz()"> QUIZZZ TIMEEEE </button>
        <button id="toggleCoversBtn" type="button">Suprise</button>

    <section class="covers-section" id="coversSection">
        <button class="gallery-close" type="button" aria-label="Close voice covers" data-close="coversSection">×</button>

    <section class="photo-section" id="photoSection">
        <button class="gallery-close" type="button" aria-label="Close photo album" data-close="photoSection">×</button>
        <div class="photo-header">
            <span>our memories</span>

        </div>

    <div class="music-panel" id="musicPanel">
        <button class="music-toggle" type="button" aria-label="Hide music player">♥♫</button>
        <label><span>love song</span><span class="mini-dot" aria-hidden="true"></span></label>
        <audio id="bgMusic" controls loop preload="auto">
            <source src="love looks pretty on u.mp3" type="audio/mpeg">
        </audio>
    </div>

    <audio id="button" preload="auto">
        <source src="button.mp3" type="audio/mpeg">
    </audio>
    <audio id="correct" preload="auto">
        <source src="correct.mp3" type="audio/mpeg">
    </audio>
    <audio id="incorrect" preload="auto">
        <source src="wrong.mp3" type="audio/wav">
    </audio>

    <script>
        let loveMeter = 25;
        let celebrationShown = false;

        const musicStateKey = 'love_page_music_state';

        function setBackgroundTrack(trackFile, trackTitle = 'love song') {
            const music = document.getElementById('bgMusic');
            if (!music) return;

            const source = music.querySelector('source') || document.createElement('source');
            source.src = trackFile;
            source.type = 'audio/mpeg';

            if (!music.querySelector('source')) {
                music.appendChild(source);
            }

            if (trackTitle) {
                const label = document.querySelector('.music-panel label span');
                if (label) {
                    label.textContent = trackTitle;
                }
            }

            music.load();
            music.volume = 0.55;
            music.currentTime = 0;
            music.play().catch(() => {
                // autoplay is blocked until the user interacts with the page
            });
            saveMusicState();
        }

        function saveMusicState() {
            const music = document.getElementById('bgMusic');
            if (!music) return;

            const source = music.querySelector('source');
            localStorage.setItem(musicStateKey, JSON.stringify({
                currentTime: music.currentTime || 0,
                isPlaying: !music.paused,
                selectedTrack: source ? source.src : 'love looks pretty on u.mp3'
            }));
        }

        function restoreMusicState() {
            const music = document.getElementById('bgMusic');
            if (!music) return;

            const source = music.querySelector('source') || document.createElement('source');
            music.volume = 0.55;

            try {
                const savedState = JSON.parse(localStorage.getItem(musicStateKey) || '{}');
                const selectedTrack = savedState.selectedTrack || 'love looks pretty on u.mp3';

                if (!music.querySelector('source')) {
                    music.appendChild(source);
                }

                source.src = selectedTrack;
                source.type = 'audio/mpeg';
                music.load();

                if (savedState.currentTime) {
                    music.currentTime = Number(savedState.currentTime);
                }

                if (savedState.isPlaying === true) {
                    music.play().catch(() => {
                        // autoplay is blocked until the user interacts with the page
                    });
                } else {
                    music.pause();
                }
            } catch (error) {
                console.log('music state restore failed', error);
                source.src = 'love looks pretty on u.mp3';
                source.type = 'audio/mpeg';
                music.appendChild(source);
                music.load();
                music.play().catch(() => {
                    // autoplay is blocked until the user interacts with the page
                });
            }

            music.addEventListener('timeupdate', saveMusicState);
            music.addEventListener('play', saveMusicState);
            music.addEventListener('pause', saveMusicState);
            window.addEventListener('beforeunload', saveMusicState);
            window.addEventListener('pagehide', saveMusicState);
        }

        // Message history + content
        const messages = [
            "You're the best laogongg ever!! ",
            "Your kisses lighten me up and make me feel so loved ",
            " I'm here for you even if you don't feel like talking, i will always listen",
            "I'm soo happy to have accepted your confession :3",
            "I love just hanging out with you its so funnnn, everything we do together feels amazing, even when it's just us both breathing 💖",
            "Where's my ring ? 💞"
        ];
        const gifs = [
            "https://i.pinimg.com/originals/99/f0/10/99f010eae4b4197909fb23b6cf021ece.gif",
            "https://i.pinimg.com/originals/f2/b0/a8/f2b0a84979a2a2056732e21f1d08d389.gif",
            "https://i.pinimg.com/originals/d8/34/7a/d8347abdb636243864fb116904101777.gif",
            "https://i.pinimg.com/originals/0b/5a/65/0b5a6543ff89d57d9144f28b005cd17c.gif"
        ];

        let history = [];
        let historyIndex = -1; // points to current shown message index in history

        function pushHistory(msgIdx) {
            // truncate forward history if we are not at the end
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            history.push(msgIdx);
            historyIndex = history.length - 1;
            updateNavButtons();
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = historyIndex <= 0;
            document.getElementById('nextBtn').disabled = historyIndex >= history.length - 1;
        }

        function showMessageAtIndex(msgIdx) {
            document.getElementById('message').innerText = messages[msgIdx % messages.length];
            document.getElementById('valentineGif').src = gifs[msgIdx % gifs.length];
        }

        function historyPrev() {
            if (historyIndex > 0) {
                historyIndex--;
                const idx = history[historyIndex];
                showMessageAtIndex(idx);
                updateNavButtons();
            }
        }

        function historyNext() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                const idx = history[historyIndex];
                showMessageAtIndex(idx);
                updateNavButtons();
            }
        }

        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            if (!sound) return;
            sound.currentTime = 0;
            sound.play();
        }

        document.addEventListener('click', function (event) {
            const clickedButton = event.target.closest('button');
            if (!clickedButton) return;
            if (clickedButton.classList.contains('option-btn')) return;
            playSound('button');
        });

        function updateLoveMeter() {
            const fill = document.getElementById('loveMeterFill');
            fill.style.width = loveMeter + '%';
        }

        function triggerSparkles() {
            const sparkles = document.getElementById('sparkles');
            sparkles.innerHTML = '';

            for (let i = 0; i < 24; i++) {
                const spark = document.createElement('span');
                spark.className = 'sparkle';
                const x = (Math.random() * 200 - 100).toFixed(2);
                const y = (Math.random() * 180 - 70).toFixed(2);
                spark.style.left = '50%';
                spark.style.top = '50%';
                spark.style.setProperty('--x', x + 'px');
                spark.style.setProperty('--y', y + 'px');
                spark.style.animationDelay = (Math.random() * 0.3).toFixed(2) + 's';
                sparkles.appendChild(spark);
            }
        }

        function showCelebration() {
            const banner = document.getElementById('celebrationBanner');
            const message = document.getElementById('message');
            const gif = document.getElementById('valentineGif');

            banner.classList.add('show');
            triggerSparkles();
            message.innerText = 'You are my person, my home<3';
            gif.src = 'https://i.pinimg.com/originals/99/f0/10/99f010eae4b4197909fb23b6cf021ece.gif';

            setTimeout(() => {
                banner.classList.remove('show');
            }, 1800);
        }

        function increaseLoveMeter() {
            loveMeter = Math.min(loveMeter + 15, 100);
            updateLoveMeter();

            if (loveMeter >= 100 && !celebrationShown) {
                celebrationShown = true;
                showCelebration();
            }
        }

        function changeMessage() {
            // If meter was full, reset so user can keep interacting and re-trigger celebration later
            if (loveMeter >= 100) {
                loveMeter = 25;
                celebrationShown = false;
                updateLoveMeter();
            }

            // pick a pseudo-random message index and save into history
            const idx = Math.floor(Math.random() * messages.length);
            pushHistory(idx);
            showMessageAtIndex(idx);
        }

        function handleMainClick() {
            changeMessage();
            increaseLoveMeter();
            playSound('button');
        }

        function goToQuiz() {
            window.location.href = "quizz.html";
        }

        function closeOtherSections(activeSectionId) {
            const sections = [
                document.getElementById('coversSection'),
                document.getElementById('photoSection')
            ];

            sections.forEach((section) => {
                if (!section) return;
                const isActive = section.id === activeSectionId;
                section.classList.toggle('show', isActive);
            });

            const coversBtn = document.getElementById('toggleCoversBtn');
            const photosBtn = document.getElementById('togglePhotosBtn');

            if (coversBtn) {
                coversBtn.textContent = document.getElementById('coversSection')?.classList.contains('show') ? '🎵 close your voice covers' : '🎵 open your voice covers';
            }

            if (photosBtn) {
                photosBtn.textContent = document.getElementById('photoSection')?.classList.contains('show') ? '📸 close our pics' : '📸 open our pics';
            }
        }

        function closeGalleryPanel(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;
            section.classList.remove('show');

            if (sectionId === 'coversSection') {
                document.getElementById('toggleCoversBtn').textContent = '🎵 open your voice covers';
            }
            if (sectionId === 'photoSection') {
                document.getElementById('togglePhotosBtn').textContent = '📸 open our pics';
            }
        }

        function toggleCoverGallery() {
            const section = document.getElementById('coversSection');
            const button = document.getElementById('toggleCoversBtn');
            if (!section || !button) return;

            const shouldOpen = !section.classList.contains('show');
            closeOtherSections(shouldOpen ? 'coversSection' : '');
            section.classList.toggle('show', shouldOpen);
            button.textContent = shouldOpen ? '🎵 close your voice covers' : '🎵 open your voice covers';

            if (shouldOpen) {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function togglePhotoGallery() {
            const section = document.getElementById('photoSection');
            const button = document.getElementById('togglePhotosBtn');
            if (!section || !button) return;

            const shouldOpen = !section.classList.contains('show');
            closeOtherSections(shouldOpen ? 'photoSection' : '');
            section.classList.toggle('show', shouldOpen);
            button.textContent = shouldOpen ? '📸 close our pics' : '📸 open our pics';

            if (shouldOpen) {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        const coverTracks = [
            {
                title: 'Love Looks Pretty on You',
                file: 'love looks pretty on u.mp3',
                note: 'main song'
            },
            {
                title: 'Cute Button Sound',
                file: 'button.mp3',
                note: 'little tap'
            },
            {
                title: 'Happy Chime',
                file: 'correct.mp3',
                note: 'bonus sparkle'
            }
        ];

        const photoAlbum = [
            {
                title: 'our first moment',
                file: 'us.png',
                note: 'favorite memory'
            },
            {
                title: 'cute us',
                file: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80',
                note: 'smile and love'
            },
            {
                title: 'late night vibes',
                file: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80',
                note: 'just us'
            },
            {
                title: 'sweetest little memory',
                file: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80',
                note: 'always yours'
            }
        ];

        function forceDownload(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.setAttribute('rel', 'noopener');
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function downloadAsset(assetUrl, filename) {
            try {
                const response = await fetch(assetUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('Fetch failed');
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                forceDownload(blobUrl, filename);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
            } catch (error) {
                const fallbackUrl = assetUrl.includes('http') ? assetUrl : new URL(assetUrl, window.location.href).href;
                const fallbackLink = document.createElement('a');
                fallbackLink.href = fallbackUrl;
                fallbackLink.download = filename;
                fallbackLink.target = '_blank';
                fallbackLink.rel = 'noopener';
                document.body.appendChild(fallbackLink);
                fallbackLink.click();
                document.body.removeChild(fallbackLink);
            }
        }

        function buildGalleryPages(items, type) {
            const pageSize = 4;
            const pages = [];
            for (let i = 0; i < items.length; i += pageSize) {
                pages.push(items.slice(i, i + pageSize));
            }
            return pages;
        }

        function renderCoverGallery() {
            const coverGrid = document.getElementById('coverGrid');
            const pages = buildGalleryPages(coverTracks, 'cover');

            pages.forEach((pageItems) => {
                const page = document.createElement('div');
                page.className = 'gallery-page';

                pageItems.forEach((track) => {
                    const card = document.createElement('article');
                    card.className = 'cover-card';
                    const safeName = `${track.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.mp3`;
                    card.innerHTML = `
                        <div class="cover-art">♪</div>
                        <h4>${track.title}</h4>
                        <p>${track.note}</p>
                        <audio controls preload="none" data-track-file="${track.file}" data-track-title="${track.title}">
                            <source src="${track.file}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                        <button class="download-btn" type="button" data-download="${track.file}" data-name="${safeName}">Download</button>
                    `;

                    const audio = card.querySelector('audio');
                    if (audio) {
                        audio.addEventListener('play', () => {
                            setBackgroundTrack(track.file, track.title);
                        });
                    }

                    page.appendChild(card);
                });

                coverGrid.appendChild(page);
            });

            coverGrid.querySelectorAll('.download-btn').forEach((button) => {
                button.addEventListener('click', async () => {
                    const file = button.dataset.download;
                    const name = button.dataset.name;
                    await downloadAsset(file, name);
                });
            });

            setupGallerySwipe('coverGrid');
        }

        function renderPhotoAlbum() {
            const photoGrid = document.getElementById('photoGrid');
            const pages = buildGalleryPages(photoAlbum, 'photo');

            pages.forEach((pageItems) => {
                const page = document.createElement('div');
                page.className = 'gallery-page';

                pageItems.forEach((photo) => {
                    const card = document.createElement('article');
                    card.className = 'photo-card';
                    const extension = photo.file.includes('http') ? (photo.file.split('?')[0].split('.').pop() || 'jpg') : (photo.file.split('.').pop() || 'jpg');
                    const safeName = `${photo.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.${extension}`;
                    card.innerHTML = `
                        <div class="photo-placeholder">♡</div>
                        <img src="${photo.file}" alt="${photo.title}" onerror="this.style.display='none'; this.parentElement.querySelector('.photo-placeholder').style.display='flex';" onload="this.parentElement.querySelector('.photo-placeholder').style.display='none';">
                        <h4>${photo.title}</h4>
                        <p>${photo.note}</p>
                        <button class="download-btn" type="button" data-download="${photo.file}" data-name="${safeName}">Download</button>
                    `;
                    page.appendChild(card);
                });

                photoGrid.appendChild(page);
            });

            photoGrid.querySelectorAll('.download-btn').forEach((button) => {
                button.addEventListener('click', async () => {
                    const file = button.dataset.download;
                    const name = button.dataset.name;
                    await downloadAsset(file, name);
                });
            });

            setupGallerySwipe('photoGrid');
        }

        function setupGallerySwipe(trackId) {
            const track = document.getElementById(trackId);
            if (!track || track.children.length <= 1) return;

            let startX = 0;
            let currentX = 0;
            let currentIndex = 0;

            const moveTo = (index) => {
                const maxIndex = track.children.length - 1;
                currentIndex = Math.min(Math.max(index, 0), maxIndex);
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            };

            track.addEventListener('touchstart', (event) => {
                startX = event.touches[0].clientX;
                currentX = startX;
            }, { passive: true });

            track.addEventListener('touchmove', (event) => {
                currentX = event.touches[0].clientX;
                const delta = currentX - startX;
                const offset = delta * 0.35;
                track.style.transform = `translateX(calc(-${currentIndex * 100}% + ${offset}px))`;
            }, { passive: true });

            track.addEventListener('touchend', () => {
                const delta = currentX - startX;
                if (delta < -50) {
                    moveTo(currentIndex + 1);
                } else if (delta > 50) {
                    moveTo(currentIndex - 1);
                } else {
                    moveTo(currentIndex);
                }
            });
        }

        function toggleMusicPanel() {
            const panel = document.getElementById('musicPanel');
            if (!panel) return;

            const isCollapsed = panel.classList.toggle('collapsed');
            const toggle = panel.querySelector('.music-toggle');
            if (toggle) {
                toggle.textContent = isCollapsed ? '♫' : '♥♫';
                toggle.setAttribute('aria-label', isCollapsed ? 'Show music player' : 'Hide music player');
            }

            localStorage.setItem('musicPanelCollapsed', String(isCollapsed));
        }

        function applyMusicPanelState() {
            const panel = document.getElementById('musicPanel');
            if (!panel) return;

            const isCollapsed = localStorage.getItem('musicPanelCollapsed') === 'true';
            panel.classList.toggle('collapsed', isCollapsed);

            const toggle = panel.querySelector('.music-toggle');
            if (toggle) {
                toggle.textContent = isCollapsed ? '♫' : '♥♫';
                toggle.setAttribute('aria-label', isCollapsed ? 'Show music player' : 'Hide music player');
            }
        }

        function setupInstallPrompt() {
            const installBtn = document.getElementById('installBtn');
            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                deferredPrompt = event;
                installBtn.style.display = 'block';
            });

            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) {
                    alert('This browser does not support install prompts. You can still use Download links below to save the files to your device.');
                    return;
                }

                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            });
        }

        // initialize: show a starting message and add to history
        (function init() {
            const startIdx = 0;
            pushHistory(startIdx);
            showMessageAtIndex(startIdx);
            updateLoveMeter();
            updateNavButtons();
            renderCoverGallery();
            renderPhotoAlbum();
            restoreMusicState();
            applyMusicPanelState();

            document.getElementById('musicPanel')?.querySelector('.music-toggle')?.addEventListener('click', toggleMusicPanel);
            document.getElementById('toggleCoversBtn').addEventListener('click', toggleCoverGallery);
            document.getElementById('togglePhotosBtn').addEventListener('click', togglePhotoGallery);
            document.querySelectorAll('.gallery-close').forEach((button) => {
                button.addEventListener('click', () => closeGalleryPanel(button.dataset.close));
            });
            setupInstallPrompt();

            // keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') historyPrev();
                if (e.key === 'ArrowRight') historyNext();
            });
        })();
    </script>
