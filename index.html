<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Babyy! <3 </title>
    <style>
        :root {
            --bg-1: #fff3f7;
            --bg-2: #ffdfe9;
            --card: rgba(255, 255, 255, 0.9);
            --rose: #f96ca8;
            --rose-deep: #e73f87;
            --rose-soft: #ffe4ee;
            --text: #5c2d45;
            --muted: #7a4b60;
            --shadow: rgba(233, 94, 150, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background: radial-gradient(circle at top, #fffafc 0%, var(--bg-1) 32%, var(--bg-2) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '♡';
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.25;
            animation: float 9s ease-in-out infinite;
        }

        body::before {
            left: 9%;
            top: 18%;
        }

        body::after {
            right: 10%;
            bottom: 18%;
            animation-delay: 1.5s;
        }

        .floating-hearts {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-hearts span {
            position: absolute;
            bottom: -50px;
            font-size: 1.5rem;
            opacity: 0.28;
            animation: drift 12s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-18px) scale(1.05); }
        }

        @keyframes drift {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.35;
            }
            100% {
                transform: translateY(-110vh) scale(1.25) rotate(18deg);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,244,249,0.92));
            border: 1px solid rgba(233, 115, 168, 0.22);
            padding: 30px 22px 22px;
            border-radius: 28px;
            box-shadow: 0 18px 40px var(--shadow);
            display: inline-block;
            max-width: 470px;
            width: min(100%, 470px);
        }

        .card::before {
            content: '✦';
            position: absolute;
            top: -10px;
            right: 20px;
            font-size: 1.8rem;
            color: var(--rose);
        }

        h2 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            color: var(--rose-deep);
            font-weight: 700;
        }

        #message {
            margin: 0 0 18px;
            font-size: 1.02rem;
            line-height: 1.6;
            color: var(--text);
        }

        .gif {
            width: 110px;
            margin: 8px auto 12px;
            border-radius: 20px;
            box-shadow: 0 12px 22px rgba(234, 88, 147, 0.18);
            display: block;
        }

        .love-meter {
            margin: 18px 0 14px;
            text-align: left;
        }

        .love-meter-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.04em;
            text-transform: lowercase;
        }

        .meter-track {
            width: 100%;
            height: 12px;
            background: rgba(255, 212, 228, 0.9);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(233, 115, 168, 0.18);
        }

        .meter-fill {
            width: 25%;
            height: 100%;
            background: linear-gradient(90deg, #ffb8d5, #ff7bb2, #e43d82);
            border-radius: inherit;
            transition: width 0.35s ease;
        }

        .celebration-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: linear-gradient(180deg, #fff1f9, #ffd8ea);
            color: var(--text);
            border: 1px solid rgba(233, 115, 168, 0.22);
            border-radius: 999px;
            padding: 10px 18px;
            box-shadow: 0 12px 24px rgba(233, 94, 150, 0.12);
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 3;
        }

        .celebration-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 10%, #ffcae1 40%, #ff6aac 100%);
            animation: pop 1s ease-out forwards;
            box-shadow: 0 0 14px rgba(233, 94, 150, 0.4);
        }

        @keyframes pop {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.2);
                opacity: 0;
            }
        }

        button {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 13px 15px;
            border: 1px solid rgba(233, 115, 168, 0.25);
            background: linear-gradient(180deg, #ff7bad, #ef4d87);
            color: white;
            border-radius: 16px;
            cursor: pointer;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 0.96rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: none;
            box-shadow: 0 10px 18px rgba(233, 94, 150, 0.14);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            background: linear-gradient(180deg, #ff8bbd, #f45d93);
            transform: translateY(-1px);
            box-shadow: 0 12px 18px rgba(233, 94, 150, 0.18);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="floating-hearts" aria-hidden="true">
        <span style="left: 8%; animation-delay: 0s;">♡</span>
        <span style="left: 14%; animation-delay: 1.2s;">♥</span>
        <span style="left: 22%; animation-delay: 2.4s;">♡</span>
        <span style="left: 31%; animation-delay: 3.1s;">♥</span>
        <span style="left: 40%; animation-delay: 4.6s;">♡</span>
        <span style="left: 49%; animation-delay: 5.1s;">♥</span>
        <span style="left: 58%; animation-delay: 0.7s;">♡</span>
        <span style="left: 67%; animation-delay: 2.9s;">♥</span>
        <span style="left: 75%; animation-delay: 4.2s;">♡</span>
        <span style="left: 83%; animation-delay: 1.7s;">♥</span>
        <span style="left: 90%; animation-delay: 3.9s;">♡</span>
        <span style="left: 96%; animation-delay: 5.8s;">♥</span>
    </div>

    <div id="sparkles" class="sparkles" aria-hidden="true"></div>
    <div id="celebrationBanner" class="celebration-banner">100% into you</div>

    <div class="card">
        <h2> Azzieeee hubby </h2>
        <p id="message">muah muah muah  💕</p>
        <img id="valentineGif" class="gif" src="https://i.pinimg.com/originals/25/e5/43/25e543bf9e35171ef1fdd476468844d7.gif" alt="cute gif">

        <div class="love-meter" aria-label="love meter">
            <span class="love-meter-label">love level</span>
            <div class="meter-track">
                <div id="loveMeterFill" class="meter-fill"></div>
            </div>
        </div>

        <button onclick="changeMessage(); increaseLoveMeter();">💌 Click heeeeereeeee UWU 💌</button>
        <button onclick="goToQuiz()">💖 QUIZZZ TIMEEEE 💖</button>
    </div>

    <audio id="button" preload="auto">
        <source src="button.mp3" type="audio/mpeg">
    </audio>
    <audio id="correct" preload="auto">
        <source src="correct.mp3" type="audio/mpeg">
    </audio>
    <audio id="incorrect" preload="auto">
        <source src="wrong.mp3" type="audio/wav">
    </audio>

    <script>
        let loveMeter = 25;
        let celebrationShown = false;

        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            if (!sound) return;
            sound.currentTime = 0;
            sound.play();
        }

        document.addEventListener('click', function (event) {
            const clickedButton = event.target.closest('button');
            if (!clickedButton) return;
            if (clickedButton.classList.contains('option-btn')) return;
            playSound('button');
        });

        function updateLoveMeter() {
            const fill = document.getElementById('loveMeterFill');
            fill.style.width = loveMeter + '%';
        }

        function triggerSparkles() {
            const sparkles = document.getElementById('sparkles');
            sparkles.innerHTML = '';

            for (let i = 0; i < 24; i++) {
                const spark = document.createElement('span');
                spark.className = 'sparkle';
                const x = (Math.random() * 200 - 100).toFixed(2);
                const y = (Math.random() * 180 - 70).toFixed(2);
                spark.style.left = '50%';
                spark.style.top = '50%';
                spark.style.setProperty('--x', x + 'px');
                spark.style.setProperty('--y', y + 'px');
                spark.style.animationDelay = (Math.random() * 0.3).toFixed(2) + 's';
                sparkles.appendChild(spark);
            }
        }

        function showCelebration() {
            const banner = document.getElementById('celebrationBanner');
            const message = document.getElementById('message');
            const gif = document.getElementById('valentineGif');

            banner.classList.add('show');
            triggerSparkles();
            message.innerText = 'You are my person, my home<3';
            gif.src = 'https://i.pinimg.com/originals/99/f0/10/99f010eae4b4197909fb23b6cf021ece.gif';

            setTimeout(() => {
                banner.classList.remove('show');
            }, 1800);
        }

        function increaseLoveMeter() {
            loveMeter = Math.min(loveMeter + 15, 100);
            updateLoveMeter();

            if (loveMeter >= 100 && !celebrationShown) {
                celebrationShown = true;
                showCelebration();
            }
        }

        function changeMessage() {
            if (loveMeter >= 100) {
                document.getElementById("message").innerText = 'You are my person, my home<3';
                return;
            }

            const messages = [
                "You're the best laogongg ever!! ",
                "Your kisses lighten me up and make me feel so loved ",
                " I'm here for you even if you don't feel like talking, i will always listen",
                "I'm soo happy to have accepted your confession :3",
                "I love just hanging out with you its so funnnn, everything we do together feels amazing, even when it's just us both breathing 💖",
                "Where's my ring ? 💞"
            ];
            const gifs = [
                "https://i.pinimg.com/originals/99/f0/10/99f010eae4b4197909fb23b6cf021ece.gif",
                "https://i.pinimg.com/originals/f2/b0/a8/f2b0a84979a2a2056732e21f1d08d389.gif",
                "https://i.pinimg.com/originals/d8/34/7a/d8347abdb636243864fb116904101777.gif",
                "https://i.pinimg.com/originals/0b/5a/65/0b5a6543ff89d57d9144f28b005cd17c.gif"
            ];
            document.getElementById("message").innerText = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById("valentineGif").src = gifs[Math.floor(Math.random() * gifs.length)];
        }

        function goToQuiz() {
            window.location.href = "quizz.html";
        }

        updateLoveMeter();
    </script>
</body>
</html>
